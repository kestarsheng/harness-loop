# A2A Service Configuration
server:
  grpc_port: 50004
  # A2A 协议 HTTP 端点（agent card / tasks）；与 gRPC 端口区分
  http_port: 50014

database:
  sqlite:
    path: /app/data/a2a.db

# LLM Configuration - DashScope
llm:
  provider: dashscope
  api_key: "<your-api-key>"  # 填真实 DashScope API Key（config.yaml 已 gitignore，真实 key 写那里）
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  model: "qwen3.7-max-2026-06-08"
  embedding_model: "text-embedding-v3"
  max_tokens: 4096

# Microservices
services:
  agent: agent-service:50006

logging:
  level: info
  format: json