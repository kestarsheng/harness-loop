receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Scrapes the DFX-M-01 metric surface exposed by harnessloop-service.
  # GATEWAY metrics are not exposed today; add a target when the gateway gains
  # its own /metrics endpoint.
  prometheus:
    config:
      scrape_configs:
        - job_name: harnessloop-service
          scrape_interval: 15s
          metrics_path: /metrics
          static_configs:
            - targets: ["harnessloop-service:9108"]

processors:
  batch:
    timeout: 5s
    send_batch_size: 512
  # Bounds cardinality on the task/stage spans without dropping attributes.
  memory_limiter:
    check_interval: 2s
    limit_mib: 256
    spike_limit_mib: 64

exporters:
  debug:
    verbosity: detailed
  # Uncomment to enable Jaeger export:
  # otlp/jaeger:
  #   endpoint: jaeger:4317
  #   tls:
  #     insecure: true

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch]
      exporters: [debug]